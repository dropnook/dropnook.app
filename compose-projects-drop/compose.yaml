name: drop

services:
  drop:
    image: ghcr.io/dropnook/dropnook:${DROPNOOK_VERSION:-2}
    container_name: drop
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 200
    environment:
      - MODE=lan
      - TZ=${TZ:-}
      - WEBUI=${WEBUI:-}
      - HOSTS=${HOSTS:-}
      - SHARE_SUBDOMAIN=${SHARE_SUBDOMAIN:-drop-share}
      # Access
      - PIN=${PIN:-}
      - USER_TEAL=${USER_TEAL:-}
      - USER_GOLD=${USER_GOLD:-}
      - USER_BLUE=${USER_BLUE:-}
      - USER_VIOLET=${USER_VIOLET:-}
      - USER_CORAL=${USER_CORAL:-}
      # HTTPS
      - TLS_CERT=${TLS_CERT-auto}
      - TLS_KEY=${TLS_KEY:-}
      - CERTS_DIR=${CERTS_DIR:-/mnt/user/appdata/Nginx-Proxy-Manager-Official/letsencrypt}
      # Cert Warden
      - CERTWARDEN_ENDPOINT_URL=${CERTWARDEN_ENDPOINT_URL:-}
      - CERT_INT_NAME=${CERT_INT_NAME:-}
      - CERT_INT_CERT_API=${CERT_INT_CERT_API:-}
      - CERT_INT_KEY_API=${CERT_INT_KEY_API:-}
      - CERT_PUB_NAME=${CERT_PUB_NAME:-}
      - CERT_PUB_CERT_API=${CERT_PUB_CERT_API:-}
      - CERT_PUB_KEY_API=${CERT_PUB_KEY_API:-}
      - CERT_CHECK_DAY=${CERT_CHECK_DAY:-30}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/mnt/user/drop}
        target: /data
        bind: { create_host_path: false }
      - ${APPDATA_DIR:-/mnt/user/appdata/drop}:/config:ro
      - ${CERTS_DIR:-/mnt/user/appdata/Nginx-Proxy-Manager-Official/letsencrypt}:${CERTS_DIR:-/mnt/user/appdata/Nginx-Proxy-Manager-Official/letsencrypt}:ro
      - /boot/config/ident.cfg:/unraid/ident.cfg:ro
    networks:
      br0:
        ipv4_address: ${DROP_IP:?DROP_IP is missing in the .env (Edit Stack - tab .env)}
    labels:
      net.unraid.docker.webui: ${WEBUI:-http://[IP]/}
      net.unraid.docker.icon: https://raw.githubusercontent.com/dropnook/dropnook.app/main/.github/icons/drop.png
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  drop-share:
    image: ghcr.io/dropnook/dropnook:${DROPNOOK_VERSION:-2}
    container_name: drop-share
    restart: unless-stopped
    depends_on:
      drop:
        condition: service_healthy
    user: "99:100"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m]
    mem_limit: 256m
    pids_limit: 64
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    environment:
      - MODE=public
      - PORT=80
      - APP_NAME=Drop
    volumes:
      - ${DATA_DIR:-/mnt/user/drop}/shares:/data/shares:ro
      - ${DATA_DIR:-/mnt/user/drop}/shares/counters:/data/shares/counters
      - ${APPDATA_DIR:-/mnt/user/appdata/drop}:/config:ro
    networks:
      br0:
        ipv4_address: ${SHARE_IP:?SHARE_IP is missing in the .env (Edit Stack - tab .env)}
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/dropnook/dropnook.app/main/.github/icons/drop-share.png
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  br0:
    external: true
